<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智慧插座 - 管理员端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#edf1f4;color:#17202a;font-size:14px;max-width:420px;margin:0 auto;min-height:100vh;padding-bottom:65px}
.banner{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(135deg,#17202a,#25313b);color:#fff;font-size:13px;position:sticky;top:0;z-index:100}
.banner-tag{background:#16826c;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700}
.page{display:none}.page.active{display:block}

/*通用*/
.header{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#fff;border-bottom:1px solid #d7e0e6}
.header-title{font-size:18px;font-weight:800;color:#17202a}
.header-export{font-size:13px;font-weight:700;padding:5px 12px;border-radius:5px;cursor:pointer;background:#edf8f3;color:#16826c}
.header-export.disabled{background:#f0f4f6;color:#b8c4cc;cursor:default}
.content{padding:12px}

/*工位页*/
.stat-row{display:flex;background:#fff;padding:8px 12px 12px;gap:6px}
.stat-item{flex:1;text-align:center;padding:8px 0;border-radius:6px;background:#f0f4f6}.stat-item.on{background:#eef4fb}.stat-item.free{background:#edf8f3}.stat-item.fault{background:#fef2f2}
.stat-num{display:block;font-size:20px;font-weight:800;color:#17202a;line-height:1.1}.stat-item.on .stat-num{color:#276fbf}.stat-item.free .stat-num{color:#16826c}.stat-item.fault .stat-num{color:#dc2626}
.stat-label{display:block;font-size:10px;color:#697783;margin-top:2px}
.room-tabs{display:flex;gap:8px;padding:10px 16px;background:#fff;overflow-x:auto;-webkit-overflow-scrolling:touch}
.room-tab{padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;background:#f0f4f6;color:#697783;border:2px solid transparent;white-space:nowrap;flex-shrink:0}.room-tab.active{background:#edf8f3;color:#16826c;border-color:#16826c}
.batch-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #f0f4f6}
.batch-select{font-size:13px;color:#16826c;font-weight:600;cursor:pointer}
.batch-count{font-size:12px;color:#697783}
.batch-right{display:flex;gap:8px}
.batch-btn{padding:5px 12px;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;border:none}.batch-btn.on{background:#16826c;color:#fff}.batch-btn.off{background:#bc3f3f;color:#fff}
.dev-row{display:flex;align-items:center;background:#fff;border-radius:6px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(23,32,42,0.04);border-left:4px solid #e5ecef}.dev-row.chk{background:#f0faf6;border-left-color:#16826c}.dev-row.bad{opacity:.45}
.dev-chk{padding-right:12px;cursor:pointer}
.chk-box{width:22px;height:22px;border:2px solid #d7e0e6;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}.chk-box.on{background:#16826c;border-color:#16826c}
.dev-left{flex:1;min-width:0}
.dev-name{font-size:15px;font-weight:700;color:#17202a}
.dev-tags{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.dev-tag{font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600}.dev-tag.free{background:#edf8f3;color:#16826c}.dev-tag.on{background:#edf8f3;color:#16826c}.dev-tag.fault{background:#fef2f2;color:#dc2626}
.dev-sub{font-size:11px;color:#64748b}.dev-params{font-size:11px;color:#94a3b8;margin-top:4px}
.dev-act{padding:6px 16px;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;border:none;margin-left:10px}.dev-act.on{background:#16826c;color:#fff}.dev-act.off{background:#bc3f3f;color:#fff}

/*审批页*/
.tab-bar2{display:flex;background:#fff;border-bottom:1px solid #e5ecef}
.tab2{flex:1;text-align:center;padding:16px 0;font-size:14px;color:#697783;font-weight:600;cursor:pointer;position:relative}.tab2.sel{color:#16826c}.tab2.sel::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:30px;height:3px;background:#16826c;border-radius:2px}
.tab-badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:8px;background:#dc2626;color:#fff;font-size:11px;font-weight:700;line-height:1.4}
.ap-card{background:#fff;border-radius:8px;padding:16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(23,32,42,0.06)}
.ap-top{display:flex;justify-content:space-between;margin-bottom:12px}
.ap-user{display:flex;align-items:center;gap:10px}
.ap-ava{width:36px;height:36px;border-radius:10px;background:#2563eb;color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ap-name{font-size:15px;font-weight:700;color:#17202a}.ap-id{font-size:11px;color:#94a3b8}
.ap-body{margin-bottom:12px}.ap-row{font-size:13px;color:#51606b;margin-bottom:4px}.ap-row.red{color:#dc2626;font-weight:600}.ap-row.gray{color:#64748b;font-size:11px;margin-top:2px}
.ap-tag{font-size:12px;padding:3px 10px;border-radius:4px;font-weight:700}.ap-tag.ok{background:#edf8f3;color:#16826c}.ap-tag.no{background:#fef2f2;color:#dc2626}
.ap-btns{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid #f0f4f6}
.ap-btn{padding:7px 24px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;border:none}.ap-btn.no{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.ap-btn.ok{background:#16826c;color:#fff}

/*管理中心*/
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(23,32,42,0.06)}
.card-row2{display:flex;justify-content:space-between;align-items:flex-start}
.card-name{font-size:16px;font-weight:700;color:#17202a;display:block}
.card-meta{font-size:12px;color:#697783;display:block;margin-top:3px}
.card-room{font-size:12px;color:#16826c;font-weight:600;display:block;margin-top:3px}
.card-del{color:#bc3f3f;font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px}
.course-card.conflict{border-left:4px solid #dc2626}
.conflict-tag{display:inline-block;margin-top:6px;font-size:11px;color:#dc2626;font-weight:700;background:#fef2f2;padding:2px 8px;border-radius:3px}
.info-tag{font-size:10px;padding:2px 8px;border-radius:3px;background:#edf8f3;color:#16826c;font-weight:600}.info-tag.room{background:#eef4fb;color:#276fbf}.info-tag.weeks{background:#f0f4f6;color:#51606b}
.info-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn-main{width:100%;padding:12px 0;text-align:center;background:#16826c;color:#fff;font-size:15px;font-weight:700;border-radius:8px;cursor:pointer;border:none;margin-bottom:10px}.btn-main:active{opacity:.9}

/*弹窗*/
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center;max-width:420px;margin:0 auto}.overlay.show{display:flex}
.dialog{width:340px;background:#fff;border-radius:12px;padding:24px 20px 18px;max-height:88vh;overflow-y:auto}
.dlg-title{font-size:17px;font-weight:800;color:#17202a;margin-bottom:16px}
.dlg-field{margin-bottom:14px}.dlg-label{font-size:12px;color:#51606b;font-weight:600;display:block;margin-bottom:4px}
.dlg-input{width:100%;padding:8px 12px;border:1px solid #e5ecef;border-radius:6px;font-size:14px;color:#17202a;font-family:inherit;background:#f7faf9}.dlg-input:focus{outline:none;border-color:#16826c}
.dlg-select{width:100%;padding:8px 12px;border:1px solid #e5ecef;border-radius:6px;font-size:14px;color:#17202a;background:#f7faf9;-webkit-appearance:none;cursor:pointer}
.dlg-row{display:flex;gap:10px}.dlg-half{flex:1}
.check-list{display:flex;flex-wrap:wrap;gap:6px}
.check-item{padding:6px 12px;border-radius:6px;background:#f0f4f6;font-size:12px;color:#51606b;cursor:pointer;font-weight:500}.check-item.active{background:#edf8f3;color:#16826c;font-weight:700}
.dlg-btns{display:flex;gap:10px;margin-top:18px}
.dlg-btn{flex:1;height:40px;line-height:40px;text-align:center;font-size:14px;font-weight:700;border-radius:8px;border:none;cursor:pointer}.dlg-btn.cancel{background:#f0f4f6;color:#697783}.dlg-btn.confirm{background:#16826c;color:#fff}.dlg-btn.danger{background:#dc2626;color:#fff}

/*告警&日志*/
.range-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #f0f4f6;flex-wrap:wrap}
.range-select{font-size:12px;color:#16826c;font-weight:600;padding:5px 12px;background:#edf8f3;border-radius:5px;border:1px solid transparent;cursor:pointer;-webkit-appearance:none}
.range-date{font-size:11px;color:#475569;padding:5px 10px;background:#f0f4f6;border-radius:4px;border:none}.range-sep{font-size:11px;color:#94a3b8}
.range-count{font-size:11px;color:#94a3b8;margin-left:auto}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #f0f4f6}
.filter-chip{padding:5px 10px;font-size:11px;color:#697783;background:#f0f4f6;border-radius:4px;cursor:pointer}.filter-chip.active{background:#16826c;color:#fff}
.log-card2{background:#fff;border-radius:8px;padding:14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(23,32,42,0.04)}
.log-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.log-act{font-size:14px;font-weight:700}.log-res{font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600}.log-res.ok{color:#16a34a;background:#edf8f3}.log-res.fail{color:#dc2626;background:#fef2f2}
.log-sub{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:4px}.log-time{font-size:11px;color:#94a3b8}
.alarm-card2{background:#fff;border-radius:8px;padding:14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(23,32,42,0.04)}
.alarm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.alarm-left2{display:flex;align-items:center;gap:8px}
.alarm-dot{width:8px;height:8px;border-radius:50%}.alarm-dot.lv1{background:#dc2626}.alarm-dot.lv2{background:#d97706}.alarm-dot.lv3{background:#94a3b8}
.alarm-name{font-size:14px;font-weight:700;color:#17202a}.alarm-time{font-size:11px;color:#94a3b8}
.alarm-msg{font-size:12px;color:#475569;line-height:1.5;margin-bottom:8px}
.alarm-tags2{display:flex;gap:6px}
.alarm-tag2{font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600}.alarm-tag2.lv1{background:#fef2f2;color:#dc2626}.alarm-tag2.lv2{background:#fff8eb;color:#b7791f}.alarm-tag2.lv3{background:#f0f4f6;color:#697783}.alarm-tag2.st{background:#edf8f3;color:#16826c}
.alarm-data{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:#f8fafc;border-radius:6px;font-size:11px;color:#64748b}.alarm-data b{color:#1e293b}

/*我的*/
.user-top{display:flex;align-items:center;padding:32px 20px 28px;background:linear-gradient(135deg,#17202a,#25313b);gap:16px}
.user-ava{width:64px;height:64px;border-radius:18px;background:rgba(22,130,108,.3);border:2px solid rgba(22,130,108,.5);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff}
.user-name{font-size:20px;font-weight:800;color:#fff}.user-tag{display:inline-block;padding:2px 10px;background:rgba(22,130,108,.4);border-radius:4px;font-size:11px;color:#7ee8c7;margin-top:4px}
.menu{background:#fff;border-radius:8px;margin:16px;overflow:hidden;box-shadow:0 1px 6px rgba(23,32,42,0.06)}
.menu-item{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid #f0f4f6;cursor:pointer}.menu-item:last-child{border-bottom:none}.menu-item:active{background:#f8fafb}
.menu-icn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-right:14px;font-size:20px}
.menu-lbl{flex:1;font-size:15px;font-weight:700;color:#17202a}.menu-arr{font-size:18px;color:#b8c4cc}
.logout{display:block;margin:12px 16px 32px;padding:14px 0;text-align:center;background:#fff;color:#bc3f3f;font-size:15px;font-weight:700;border-radius:8px;border:1px solid #e0a6a6}
.empty2{text-align:center;padding:50px 0;color:#b8c4cc;font-size:14px}

/*子页面*/
.sub{display:none}.sub.on{display:block}
.sub-head{display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border-bottom:1px solid #d7e0e6;cursor:pointer}
.sub-back{font-size:18px;color:#16826c;font-weight:700}

/*toast/reject*/
.toast{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 28px;border-radius:8px;font-size:14px;z-index:999;display:none}.toast.show{display:block}
.reject-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center;max-width:420px;margin:0 auto}.reject-overlay.show{display:flex}
.reject-box{width:320px;background:#fff;border-radius:12px;padding:24px 20px}
.reject-title{font-size:17px;font-weight:800;color:#17202a;margin-bottom:12px}.reject-info{font-size:13px;color:#64748b;line-height:1.6;margin-bottom:14px}
.reject-input{width:100%;min-height:80px;border:1px solid #e5ecef;border-radius:6px;padding:10px 12px;font-size:14px;color:#17202a;resize:vertical;font-family:inherit}
.reject-btns{display:flex;gap:10px;margin-top:16px}
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:998;display:none;align-items:center;justify-content:center;max-width:420px;margin:0 auto}.confirm-overlay.show{display:flex}
.confirm-box{width:280px;background:#fff;border-radius:12px;padding:24px 20px 18px;text-align:center}
.confirm-title{font-size:17px;font-weight:800;color:#17202a;margin-bottom:8px}.confirm-msg{font-size:14px;color:#51606b;line-height:1.6;margin-bottom:18px;white-space:pre-line}
.confirm-btns{display:flex;gap:10px}
.confirm-btn{flex:1;height:40px;line-height:40px;text-align:center;font-size:14px;font-weight:700;border-radius:8px;border:none;cursor:pointer}.confirm-btn.cancel{background:#f0f4f6;color:#697783}.confirm-btn.ok{background:#16826c;color:#fff}.confirm-btn.danger{background:#dc2626;color:#fff}

/*tab*/
.tab-bar{display:flex;position:fixed;bottom:0;left:0;right:0;max-width:420px;margin:0 auto;height:55px;background:#fff;border-top:1px solid #e5ecef;z-index:99}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}.tab-item.sel .tab-text{color:#16826c;font-weight:700}
.tab-icon-wrap{position:relative}.tab-icon{font-size:20px}
.tab-badge{position:absolute;top:-10px;right:-14px;min-width:16px;height:16px;line-height:16px;text-align:center;background:#dc2626;color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 4px}
.tab-text{font-size:11px;color:#697783}

/* 小程序接入与视觉统一 */
:root{--app-bg:#f8faf9;--app-ink:#162127;--app-muted:#687782;--app-line:#d7e1df;--app-accent:#1f8a70;--app-accent-dark:#285e59;--phone-edge:#17232b}
body{max-width:none;min-height:100vh;margin:0;padding:22px;display:grid;justify-items:center;align-items:start;background:linear-gradient(135deg,rgba(31,138,112,.08),transparent 34%),linear-gradient(90deg,rgba(22,33,39,.045) 1px,transparent 1px),linear-gradient(180deg,rgba(22,33,39,.04) 1px,transparent 1px),#e8edf1;background-size:28px 28px;color:var(--app-ink)}
.power-phone{width:375px;height:760px;position:relative;overflow:hidden;background:var(--app-bg);border:10px solid var(--phone-edge);border-radius:34px;box-shadow:0 28px 58px rgba(22,33,39,.25)}
.module-status{height:30px;padding:8px 18px 0;display:flex;align-items:center;justify-content:space-between;background:#fff;color:#4b5563;font-size:12px}
.module-header{height:52px;display:grid;grid-template-columns:62px 1fr 76px;align-items:center;padding:0 12px;background:#fff;border-bottom:1px solid #dfe7e5;position:relative;z-index:110;box-shadow:0 6px 16px rgba(22,33,39,.04)}
.module-title{text-align:center;font-size:17px;font-weight:800;color:#172f29}
.module-level{text-align:center;padding:3px 7px;border-radius:999px;background:#e8f4f0;color:#2f7365;font-size:10px;font-weight:800;white-space:nowrap}
.module-switch{height:28px;padding:0 8px;border:1px solid #a9d2c7;border-radius:7px;background:#edf7f3;color:#286b5d;font-size:10px;font-weight:800;white-space:nowrap;cursor:pointer}
.banner{position:relative;top:auto;padding:10px 14px;background:linear-gradient(135deg,#e8f4f0,#f8fbfa);color:#31574e;border-bottom:1px solid #cfe1dc;z-index:90}
.banner-tag{background:#d8eee7;color:#256657}
.header,.tab-bar2,.batch-row,.room-tabs,.tab-bar,.range-bar,.filter-row{border-color:var(--app-line)}
.content{background:var(--app-bg)}
.dev-row,.ap-card,.card,.log-card2,.alarm-card2,.menu{border:1px solid #e0e8e5;box-shadow:0 3px 10px rgba(34,64,57,.04)}
.stat-item{background:#f2f6f4}.stat-item.free,.dev-tag.free,.dev-tag.on{background:#e9f4f0}
.room-tab.active{background:#e9f4f0;color:var(--app-accent);border-color:var(--app-accent)}
.batch-select,.tab2.sel,.sub-back,.header-export{color:var(--app-accent)}
.tab2.sel::after{background:var(--app-accent)}
.dev-act.on,.batch-btn.on,.ap-btn.ok,.btn-main,.dlg-btn.confirm,.confirm-btn.ok{background:var(--app-accent)}
.user-top{background:linear-gradient(135deg,var(--app-accent-dark),#397c6e)}
.user-tag{background:rgba(255,255,255,.13);color:#d9f1ea}
.tab-bar2 .tab-badge{position:static;display:inline-block;margin-left:6px;min-width:auto;height:auto;line-height:1.4;padding:1px 8px;vertical-align:1px}
.tab-bar .tab-badge{position:absolute}
.power-phone>.page{height:calc(100% - 126px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:70px}
.power-phone>.page::-webkit-scrollbar{width:0;height:0}
.power-phone .tab-bar{position:absolute;max-width:none;height:64px;padding-bottom:0}
.power-phone .overlay,.power-phone .reject-overlay,.power-phone .confirm-overlay{position:absolute;max-width:none}
.power-phone .toast{position:absolute}
@media(max-width:430px){body{padding:8px}.power-phone{width:calc(100vw - 16px);height:calc(100vh - 16px);border-width:8px;border-radius:28px}}
</style>
</head>
<body>

<div class="power-phone">
<div class="module-status"><span>9:41</span><span>5G&nbsp;&nbsp;100%</span></div>
<div class="module-header">
  <div class="module-level">一级管理员</div>
  <div class="module-title">电源安全管理</div>
  <button class="module-switch" type="button" aria-label="返回智能柜端" onclick="returnToMiniApp()">智能柜端</button>
</div>

<div class="banner"><span>👨‍💼</span><span>管理员 · 王管理员</span><span class="banner-tag">全部权限</span></div>

<!-- ===== 工位 ===== -->
<div class="page active" id="pg-stations">
  <div class="room-tabs" id="roomTabs"></div>
  <div id="roomStats" class="stat-row"></div>
  <div class="batch-row"><div class="batch-select" id="selAll" onclick="mgrSelAll()">全选</div><span class="batch-count" id="selCnt"></span><div class="batch-right"><button class="batch-btn on" id="batchOn" style="display:none" onclick="mgrBon()">通电(N)</button><button class="batch-btn off" id="batchOff" style="display:none" onclick="mgrBoff()">断电(N)</button></div></div>
  <div class="content" id="devList"></div>
</div>

<!-- ===== 审批 ===== -->
<div class="page" id="pg-approval">
  <div class="header"><span class="header-title">预约审批</span></div>
  <div class="tab-bar2"><div class="tab2 sel" id="tb-pending" onclick="apprTab('pending')">待审批<span class="tab-badge" id="aprBadge" style="display:none">0</span></div><div class="tab2" id="tb-done" onclick="apprTab('done')">已审批</div></div>
  <div class="content" id="aprContent"></div>
</div>

<!-- ===== 管理 ===== -->

function apprTab(t){_apprTab=t;document.getElementById('tb-pending').classList.toggle('sel',t==='pending');document.getElementById('tb-done').classList.toggle('sel',t==='done');var p=RS.filter(function(r){return r.status==='pending_review'}),d=RS.filter(function(r){return r.status!=='pending_review'});document.getElementById('aprBadge').style.display=p.length?'inline-block':'none';document.getElementById('aprBadge').textContent=p.length;document.getElementById('tBadge').style.display=p.length?'block':'none';document.getElementById('tBadge').textContent=p.length;var list=t==='pending'?p:d,h='';if(t==='pending'){list.forEach(function(r){h+='<div class="ap-card"><div class="ap-top"><div class="ap-user"><div class="ap-ava">'+r.studentName[0]+'</div><div><div class="ap-name">'+r.studentName+'</div><div class="ap-id">'+r.studentId+'</div></div></div></div><div class="ap-body"><div class="ap-row">📍 '+r.stationName+'（'+r.location+'）</div><div class="ap-row">📅 '+r.date+' '+r.timeSlot+'</div><div class="ap-row">📝 '+r.purpose+'</div></div><div class="ap-btns"><button class="ap-btn no" onclick="openRej(\''+r.id+'\')">驳回</button><button class="ap-btn ok" onclick="apprOk(\''+r.id+'\')">通过</button></div></div>'})}else{list.forEach(function(r){h+='<div class="ap-card"><div class="ap-top"><div class="ap-user"><div class="ap-ava">'+r.studentName[0]+'</div><div><div class="ap-name">'+r.studentName+'</div><div class="ap-id">'+r.studentId+'</div></div></div><div class="ap-tag '+(r.status==='approved'?'ok':'no')+'">'+r.statusText+'</div></div><div class="ap-body"><div class="ap-row">📍 '+r.stationName+'（'+r.location+'）</div><div class="ap-row">📅 '+r.date+' '+r.timeSlot+'</div><div class="ap-row">📝 '+r.purpose+'</div>'+(r.rejectReason?'<div class="ap-row red">❌ 驳回原因：'+r.rejectReason+'</div>':'')+(r.auditorName?'<div class="ap-row gray">👤 审批人：'+r.auditorName+' · '+r.auditTime+'</div>':'')+'</div></div>'})};if(!list.length)h='<div class="empty2">暂无记录</div>';document.getElementById('aprContent').innerHTML=h}
function apprOk(id){var r=RS.find(function(x){return x.id===id});if(!r)return;cfm('确认通过','通过「'+r.studentName+'」的预约申请？\n工位：'+r.stationName+'\n时段：'+r.timeSlot,'确认通过','confirm',function(ok){if(ok){r.status='approved';r.statusText='已通过';r.auditorName='王管理员';r.auditTime=new Date().toISOString().replace('T',' ').slice(0,19);apprTab(_apprTab);toast('已通过')}})}
function openRej(id){rejTarget=RS.find(function(x){return x.id===id});if(!rejTarget)return;document.getElementById('rejectInfo').textContent=rejTarget.studentName+' · '+rejTarget.stationName+'\n'+rejTarget.date+' '+rejTarget.timeSlot;document.getElementById('rejectText').value='';document.getElementById('rejectBox').classList.add('show')}
function closeReject(){document.getElementById('rejectBox').classList.remove('show');rejTarget=null}
function doReject(){var s=document.getElementById('rejectText').value.trim();if(!s){toast('请输入驳回原因');return};rejTarget.status='rejected';rejTarget.statusText='已驳回';rejTarget.rejectReason=s;rejTarget.auditorName='王管理员';rejTarget.auditTime=new Date().toISOString().replace('T',' ').slice(0,19);closeReject();apprTab(_apprTab);toast('已驳回')}

function delCourse(id){cfm('删除课表','确定删除？','确认删除','danger',function(ok){if(ok){CS=CS.filter(function(c){return c.id!==id});mgrTab('courses');toast('已删除')}})}
function _renderChecks(boxId,obj){var h='';ALL_R.forEach(function(r){h+='<div class="check-item'+(obj[r]?' active':'')+'" onclick="_toggleCheck(\''+boxId+'\',\''+r+'\')">'+(obj[r]?'☑':'☐')+' '+r+'</div>'});document.getElementById(boxId).innerHTML=h}

//告警
function genAlarmHTML(){
  var lv={1:'安全类',2:'异常类',3:'离线类'},now=new Date(),td2=today(),ds='',de=''
  if(alarmRng===0){var s=new Date(now.getTime()-7*864e5);ds=FMT(s);de=td2}else if(alarmRng===1){var s=new Date(now.getTime()-15*864e5);ds=FMT(s);de=td2}else if(alarmRng===2){var s=new Date(now.getTime()-30*864e5);ds=FMT(s);de=td2}
  var list=ALARMS;if(ds&&de)list=list.filter(function(a){var ad=(a.time||'').split(' ')[0];return ad>=ds&&ad<=de})
  var h='';h+='<div class="range-bar"><select class="range-select" onchange="alarmRng=parseInt(this.value);genAlarmHTML()"><option value="0"'+(alarmRng===0?' selected':'')+'>最近7天</option><option value="1"'+(alarmRng===1?' selected':'')+'>最近15天</option><option value="2"'+(alarmRng===2?' selected':'')+'>最近30天</option></select><span class="header-export" style="margin-left:auto;cursor:pointer" onclick="exportAlarmCSV()">📤 导出</span><span class="range-count">'+list.length+' 条</span></div><div class="content">'
  list.forEach(function(a){h+='<div class="alarm-card2"><div class="alarm-top"><div class="alarm-left2"><div class="alarm-dot lv'+a.level+'"></div><span class="alarm-name">'+(a.lab||'')+' · '+a.stationName+'</span></div><span class="alarm-time">'+a.time+'</span></div><div class="alarm-msg">'+a.message+'</div><div class="alarm-tags2"><span class="alarm-tag2 lv'+a.level+'">'+lv[a.level]+'</span><span class="alarm-tag2 st">'+(a.status==='read'?'已读':'未读')+'</span></div>'+(a.actualValue?'<div class="alarm-data">实测：<b>'+a.actualValue+'</b> | 阈值：<b>'+a.threshold+'</b></div>':'')+'</div>'})
  if(!list.length)h+='<div class="empty2">暂无告警记录</div>'
  h+='</div>';document.getElementById('alarmList').innerHTML=h
}
function FMT(d){return d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate())}

//操作日志
function genLogHTML(){
  var now=new Date(),td2=today(),ds2='',de2=''
  if(logRng===0){var s=new Date(now.getTime()-7*864e5);ds2=FMT(s);de2=td2}else if(logRng===1){var s=new Date(now.getTime()-15*864e5);ds2=FMT(s);de2=td2}else if(logRng===2){var s=new Date(now.getTime()-30*864e5);ds2=FMT(s);de2=td2}
  var list=LOGS;if(ds2&&de2)list=list.filter(function(l){var ld=(l.time||'').split(' ')[0];return ld>=ds2&&ld<=de2});if(logFltr!=='all')list=list.filter(function(l){return l.actionType===logFltr})
  var colors={schedule_on:'#16a34a',remote_on:'#16a34a',schedule_off:'#64748b',remote_off:'#64748b'}
  var h='';h+='<div class="range-bar"><select class="range-select" onchange="logRng=parseInt(this.value);genLogHTML()"><option value="0"'+(logRng===0?' selected':'')+'>最近7天</option><option value="1"'+(logRng===1?' selected':'')+'>最近15天</option><option value="2"'+(logRng===2?' selected':'')+'>最近30天</option></select><span class="header-export" style="margin-left:auto;cursor:pointer" onclick="exportLogCSV()">📤 导出</span><span class="range-count">'+list.length+' 条</span></div><div class="filter-row"><div class="filter-chip'+(logFltr==='all'?' active':'')+'" onclick="logFltr=\'all\';genLogHTML()">全部</div><div class="filter-chip'+(logFltr==='remote_on'?' active':'')+'" onclick="logFltr=\'remote_on\';genLogHTML()">远程通电</div><div class="filter-chip'+(logFltr==='remote_off'?' active':'')+'" onclick="logFltr=\'remote_off\';genLogHTML()">远程断电</div><div class="filter-chip'+(logFltr==='schedule_on'?' active':'')+'" onclick="logFltr=\'schedule_on\';genLogHTML()">定时通电</div><div class="filter-chip'+(logFltr==='schedule_off'?' active':'')+'" onclick="logFltr=\'schedule_off\';genLogHTML()">定时断电</div></div><div class="content">'
  list.forEach(function(l){h+='<div class="log-card2"><div class="log-row"><span class="log-act" style="color:'+(colors[l.actionType]||'#334155')+'">'+l.action+'</span><span class="log-res '+(l.result==='成功'?'ok':'fail')+'">'+l.result+'</span></div><div class="log-sub"><span>'+(l.lab||'')+' · '+l.stationName+'</span><span class="log-time">'+l.time+'</span></div><div class="log-sub"><span>'+l.source+'</span><span>'+l.operator+'</span></div></div>'});if(!list.length)h+='<div class="empty2">暂无操作日志</div>';h+='</div>';document.getElementById('logList').innerHTML=h
}

// CSV导出
function exportAlarmCSV(){
  var lv={1:'安全类',2:'异常类',3:'离线类'},now=new Date(),td2=today(),ds='',de=''
  if(alarmRng===0){var s=new Date(now.getTime()-7*864e5);ds=FMT(s);de=td2}else if(alarmRng===1){var s=new Date(now.getTime()-15*864e5);ds=FMT(s);de=td2}else if(alarmRng===2){var s=new Date(now.getTime()-30*864e5);ds=FMT(s);de=td2}
  var list=ALARMS;if(ds&&de)list=list.filter(function(a){var ad=(a.time||'').split(' ')[0];return ad>=ds&&ad<=de})
  var csv='时间,工位,实验室,告警类型,级别,实测值,阈值,状态,详情\n'
  list.forEach(function(a){csv+=[a.time,a.stationName,a.lab||'',lv[a.level]||'',a.level,a.actualValue||'',a.threshold||'',a.status==='read'?'已读':'未读','"'+a.message.replace(/"/g,'""')+'"'].join(',')+'\n'})
  downloadCSV(csv,'告警记录_'+today()+'.csv')
}
function exportLogCSV(){
  var now=new Date(),td2=today(),ds2='',de2=''
  if(logRng===0){var s=new Date(now.getTime()-7*864e5);ds2=FMT(s);de2=td2}else if(logRng===1){var s=new Date(now.getTime()-15*864e5);ds2=FMT(s);de2=td2}else if(logRng===2){var s=new Date(now.getTime()-30*864e5);ds2=FMT(s);de2=td2}
  var list=LOGS;if(ds2&&de2)list=list.filter(function(l){var ld=(l.time||'').split(' ')[0];return ld>=ds2&&ld<=de2});if(logFltr!=='all')list=list.filter(function(l){return l.actionType===logFltr})
  var csv='时间,工位,实验室,操作,操作类型,来源,操作人,结果\n'
  list.forEach(function(l){csv+=[l.time,l.stationName,l.lab||'',l.action,l.actionType,l.source,l.operator,l.result].join(',')+'\n'})
  downloadCSV(csv,'操作日志_'+today()+'.csv')
}
function downloadCSV(csv,fn){
  var BOM='﻿',blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'})
  var url=URL.createObjectURL(blob),a=document.createElement('a')
  a.href=url;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url)
}

//课表冲突检测
function checkCourseConflict(c){
  c._conflict=false
  CS.forEach(function(o){
    if(o===c||o._conflict)return
    var shareRoom=(c.rooms||[]).some(function(r){return (o.rooms||[]).indexOf(r)>=0})
    if(!shareRoom||c.dayOfWeek!==o.dayOfWeek)return
    var cStart=TM(c.startTime||'00:00'),cEnd=TM(c.endTime||'00:00')
    var oStart=TM(o.startTime||'00:00'),oEnd=TM(o.endTime||'00:00')
    if(cStart<oEnd&&cEnd>oStart){c._conflict=true;o._conflict=true}
  })
}
